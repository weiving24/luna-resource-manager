name: C Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            use_docker: false
          - os: ubuntu-24.04-arm
            arch: aarch64
            use_docker: false
          # 使用 32 位 x86 Docker 原生编译
          - os: ubuntu-latest
            arch: i386
            use_docker: "i386/ubuntu:latest"
          # 使用 32 位 ARM Docker 原生编译（利用 QEMU 模拟）
          - os: ubuntu-latest
            arch: armv7l
            use_docker: "arm32v7/ubuntu:latest"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Natively (x86_64 & aarch64)
      if: matrix.use_docker == false
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev libarchive-dev pkg-config
        make
        mkdir -p release
        cp bin/luna-resource-manager release/
        cp README.md release/
        cp LICENSE release/
        cd release && tar -czvf luna-resource-manager-linux-${{ matrix.arch }}.tar.gz *

    - name: Build in Docker (i386 & armv7l)
      if: matrix.use_docker != false
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ${{ matrix.use_docker }} /bin/bash -c "
          apt-get update && \
          apt-get install -y build-essential libncurses-dev libarchive-dev pkg-config && \
          make && \
          mkdir -p release && \
          cp bin/luna-resource-manager release/ && \
          cp README.md release/ && \
          cp LICENSE release/ && \
          cd release && tar -czvf luna-resource-manager-linux-${{ matrix.arch }}.tar.gz *
        "

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luna-resource-manager-linux-${{ matrix.arch }}
        path: release/luna-resource-manager-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    runs-on: macos-14
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install ncurses libarchive pkg-config

    - name: Build project
      run: |
        NCURSES_PREFIX=$(brew --prefix ncurses)
        LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
        make CC="clang" \
             CPPFLAGS="-D_POSIX_C_SOURCE=200809L -D_XOPEN_SOURCE=700 -I. -Iinclude -Iuidl -Iprt -Icore -Iapp -I${NCURSES_PREFIX}/include -I${LIBARCHIVE_PREFIX}/include" \
             LDFLAGS="-L${NCURSES_PREFIX}/lib -L${LIBARCHIVE_PREFIX}/lib" \
             CURSES_LIBS="-lncursesw" \
             ARCHIVE_LIBS="-larchive"

    - name: Package binary
      run: |
        mkdir -p release
        cp bin/luna-resource-manager release/
        cp README.md release/
        cp LICENSE release/
        cd release && tar -czvf luna-resource-manager-macos-arm64.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luna-resource-manager-macos-arm64
        path: release/luna-resource-manager-macos-arm64.tar.gz

  publish-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*.tar.gz
