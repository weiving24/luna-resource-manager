name: C Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        if [ "${{ matrix.arch }}" = "aarch64" ]; then
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libncurses-dev:arm64 libarchive-dev:arm64
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        else
          sudo apt-get install -y build-essential libncurses-dev libarchive-dev pkg-config
          echo "CC=gcc" >> $GITHUB_ENV
        fi

    - name: Build project
      run: make CC="${{ env.CC }}"

    - name: Run tests
      run: make test

    - name: Package binary
      run: |
        mkdir -p release
        cp bin/luna-resource-manager release/ || echo "Check bin path"
        cp README.md release/
        cp LICENSE release/
        cd release && tar -czvf luna-resource-manager-linux-${{ matrix.arch }}.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luna-resource-manager-linux-${{ matrix.arch }}
        path: release/luna-resource-manager-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ncurses libarchive pkg-config
        LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
        echo "CPPFLAGS=-I${LIBARCHIVE_PREFIX}/include" >> $GITHUB_ENV
        echo "LDFLAGS=-L${LIBARCHIVE_PREFIX}/lib" >> $GITHUB_ENV

    - name: Build project
      run: make CC="clang -arch ${{ matrix.arch }}"

    - name: Run tests
      run: make test

    - name: Package binary
      run: |
        mkdir -p release
        cp bin/luna-resource-manager release/ || echo "Check bin path"
        cp README.md release/
        cp LICENSE release/
        cd release && tar -czvf luna-resource-manager-macos-${{ matrix.arch }}.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luna-resource-manager-macos-${{ matrix.arch }}
        path: release/luna-resource-manager-macos-${{ matrix.arch }}.tar.gz

  publish-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*.tar.gz
