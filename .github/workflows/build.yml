name: C Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev libarchive-dev pkg-config

    - name: Build project
      run: make

    - name: Package binary
      run: |
        mkdir -p release
        cp bin/luna-resource-manager release/
        cp README.md release/
        cp LICENSE release/
        cd release && tar -czvf luna-resource-manager-linux-${{ matrix.arch }}.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luna-resource-manager-linux-${{ matrix.arch }}
        path: release/luna-resource-manager-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ncurses libarchive pkg-config

    - name: Build project
      run: |
        NCURSES_PREFIX=$(brew --prefix ncurses)
        LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
        
        make CC="clang" \
             CPPFLAGS="-D_POSIX_C_SOURCE=200809L -D_XOPEN_SOURCE=700 -I. -Iinclude -Iuidl -Iprt -Icore -Iapp -I${NCURSES_PREFIX}/include -I${LIBARCHIVE_PREFIX}/include" \
             LDFLAGS="-L${NCURSES_PREFIX}/lib -L${LIBARCHIVE_PREFIX}/lib" \
             CURSES_LIBS="${NCURSES_PREFIX}/lib/libncursesw.a" \
             ARCHIVE_LIBS="${LIBARCHIVE_PREFIX}/lib/libarchive.a"

    - name: Package binary
      run: |
        mkdir -p release
        cp bin/luna-resource-manager release/
        cp README.md release/
        cp LICENSE release/
        cd release && tar -czvf luna-resource-manager-macos-${{ matrix.arch }}.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luna-resource-manager-macos-${{ matrix.arch }}
        path: release/luna-resource-manager-macos-${{ matrix.arch }}.tar.gz

  publish-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*.tar.gz
