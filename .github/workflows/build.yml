
name: C Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev libarchive-dev pkg-config

    - name: Build project
      run: make

    - name: Run tests
      run: make test

    - name: Package binary
      run: |
        mkdir -p release
        cp bin/luna-resource-manager release/
        cp README.md release/
        cp LICENSE release/
        cd release && tar -czvf luna-resource-manager-linux-x86_64.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luna-resource-manager-linux
        path: release/luna-resource-manager-linux-x86_64.tar.gz
